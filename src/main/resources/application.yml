server:
  port: 15090

spring:
  application:
    name: group-center
  #  security:
  #    user:
  #      name: admin
  #      password: 123456
  profiles:
    # SPRING_PROFILES_ACTIVE=dev
    active: dev
  datasource:
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:15096/group_center?useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    type: com.alibaba.druid.pool.DruidDataSource

  sql:
    init:
      encoding: UTF-8
      schema-locations: classpath*:db/mysql/init-schema.sql
      continue-on-error: true
      mode: always
#      data-locations: classpath*:db/mysql/init-data.sql

logging:
  file:
    name: logs/springboot.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 7

# Bot配置文件路径（权威来源；BotPushService / LarkBotConfig 共用）
bot:
  config:
    file: Config/Bot/bot-groups.yaml

# 代理配置文件路径（权威来源；ProxyConfigLoader 读取）
proxy:
  config:
    file: Config/Proxy/proxy.yaml

# 心跳配置
heartbeat:
  # 时间同步阈值（秒），默认120秒（2分钟）
  time-sync-threshold: 120
  # 离线超时时间（秒），默认7200秒（2小时）
  offline-timeout: 7200
  # 在线状态检查时间（秒），默认120秒（2分钟）
  online-check-interval: 120
  # 定时任务执行间隔（毫秒），默认300000毫秒（5分钟）
  scheduled-interval: 300000
  # Ping失败报警阈值（秒），默认3600秒（1小时）
  ping-failure-alarm-threshold: 3600
  # 报警推送间隔（秒）：相同类型报警的最小推送间隔，避免刷屏
  alarm-push-interval: 3600

# 实时聚合层（pull-through-cache）：后端主动 pull agent(nvi-notify) 数据并做 TTL 内存缓存
realtime:
  # 缓存 TTL（秒）：命中期内直接返回缓存，不再拉取 agent
  cache-ttl-seconds: 5
  # 过期阈值（秒）：freshness 超过该值将数据标记为 stale（用于 last-known-good 回退）
  stale-threshold: 60
  # agent 反向代理 origin：机器 apiUrl 为相对路径（如 /gpu/3090）时必填，
  # 后端拼接为绝对地址后再 pull；可用环境变量 REALTIME_AGENT_BASE_URL 覆盖。
  # 若 apiUrl 本身已是 http(s) 绝对地址，则忽略此项。
  agent-base-url: ${REALTIME_AGENT_BASE_URL:}

